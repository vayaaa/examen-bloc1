<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wacdo - Menu</title>
    <meta name="description" content="Choisissez votre prochain repas.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">

    <link href="/css/main.css" rel="stylesheet" />
</head>

<body>
    <main class="borne">

        <div class="menu">
            <!-- Catégories -->
            <section class="categories">
                <button class="slider slider-left" id="slider-left"> <img src="img/icons/fleche-slider.png"
                        alt="slider-left"></button>

                <ul id="categories-container"></ul>

                <button class="slider slider-right" id="slider-right"> <img src="img/icons/fleche-slider.png"
                        alt="slider-right"></button>
            </section>

            <!-- Produits -->
            <section class="products">
                <h2 id="categorie-title"></h2>
                <p id="description"></p>
                <div id="products-container"></div>
            </section>
        </div>

        <!-- Panier -->
        <section class="cart">
            <img class="logo" src="img/logo.png" alt="logo-Wacdo">
            <div class="commande">
                <div class="commande-infos">
                    <p>Commande numéro </p>
                    <p id="orderType"></p>
                </div>
                <p id="orderNumber" class="order-number"></p>
            </div>

            <hr>

            <div id="order-container"></div>

            <hr>

            <div id="total-container">
                <div class="total-info">
                    <p>TOTAL (ttc)</p>
                    <p id="total"></p>
                </div>
                <div class="buttons">
                    <button class="cancel" type="button" id="cancel-button"
                        aria-label="Abandonner la commande">Abandon</button>
                    <button class="pay" type="button" id="modal-pay" aria-label="Payer la commande">Payer</button>
                </div>
            </div>

        </section>
    </main>



    <!-- Modale générale -->
    <dialog id="modal">
        <div class="modal-content">

            <button class="close-modal" type="button" aria-label="Fermer la modale"><img src="img/icons/supprimer.png"
                    alt=""></button>
            <button id="modal-back" type="button" aria-label="Retour à la page précédente" hidden> Retour </button>

            <div class="modal-container">
                <h1 id="modal-title"></h1>
                <p id="modal-text"></p>

                <div class="modal-choices" id="modal-choices">
                    <!-- Ici tous les components à afficher  -->
                </div>

                <div class="counter-container" hidden>
                    <button class="less" tyxpe="button" id="btn-less" aria-label="enlever">-</button>
                    <span class="counter" id="counter">1</span>
                    <button class="more" type="button" id="btn-more" aria-label="ajouter">+</button>
                </div>

                <div class="modal-actions">
                    <button class="cancel" type="button" id="cancel-modal" aria-label="Annuler" hidden>Annuler</button>
                    <button class="next" type="button" id="modal-next" aria-label="Passer à l'étape suivante">Etape
                        Suivante</button>
                    <button class="next" type="button" id="drink-add" aria-label="Ajouter à ma commande" hidden>Ajouter
                        a ma commande</button>
                </div>
            </div>
        </div>
    </dialog>



    <script type="module" src="js/menu.js"></script>
</body>

</html>
