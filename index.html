<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borne Wacdo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">

    <link href="/css/main.css" rel="stylesheet" />
</head>

<body>

    <main class="home">
        <div class="container">
            <h1>Bonjour, </h1>

            <p>Souhaitez-vous consommer votre menu sur place <br>
                ou préférez-vous l'emporter ?</p>

            <div class="content">
                <button class="choice" type="button" data-type="sur-place">
                    <img src="img/icons/illustration-sur-place.png" alt="icon sur place">
                    <p>Sur Place</p>
                </button>

                <button class="choice" type="button" data-type="a-emporter">
                    <img src="img/icons/illustration-a-emporter.png" alt="icon a emporter">
                    <p>A Emporter</p>
                </button>

            </div>

        </div>
    </main>

    <script src="js/main.js"></script>
</body>

</html>
